name: Build ImanAdmin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-32bit:
    name: Build 32-bit
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install cryptography==3.4.8
      
      - name: 🏗️ Build OneFile
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAdmin --add-data="Icon.ico;." --collect-all PyQt5 --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --noupx --clean --noconfirm main.py
      
      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImanAdmin-32bit
          path: dist/ImanAdmin.exe
          retention-days: 30

  build-64bit:
    name: Build 64-bit
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.8 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install cryptography==3.4.8
      
      - name: 🏗️ Build OneFile
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAdmin --add-data="Icon.ico;." --collect-all PyQt5 --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --noupx --clean --noconfirm main.py
      
      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImanAdmin-64bit
          path: dist/ImanAdmin.exe
          retention-days: 30