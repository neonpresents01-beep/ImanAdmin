name: Build ImanAdmin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-64bit:
    name: Build 64-bit
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.10 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      
      - name: 📦 Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.3.0
          python -m pip install PyQt5==5.15.10
          python -m pip install cryptography==41.0.7
      
      - name: 🏗️ Build OneFile
        shell: cmd
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAdmin --add-data="Icon.ico;." --collect-all PyQt5 --collect-all cryptography --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --hidden-import=license_core --hidden-import=registry_guard --hidden-import=sqlite3 --noupx --clean --noconfirm main.py
      
      - name: 🧪 Test Build
        shell: pwsh
        run: |
          if (Test-Path "dist/ImanAdmin.exe") {
            Write-Host "✅ EXE ساخته شد"
            Get-Item "dist/ImanAdmin.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE ساخته نشد!"
            exit 1
          }
      
      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImanAdmin-64bit
          path: dist/ImanAdmin.exe
          retention-days: 30

  build-32bit:
    name: Build 32-bit
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.10 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x86'
      
      - name: 📦 Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.3.0
          python -m pip install PyQt5==5.15.10
          python -m pip install cryptography==41.0.7
      
      - name: 🏗️ Build OneFile
        shell: cmd
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAdmin --add-data="Icon.ico;." --collect-all PyQt5 --collect-all cryptography --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --hidden-import=license_core --hidden-import=registry_guard --hidden-import=sqlite3 --noupx --clean --noconfirm main.py
      
      - name: 🧪 Test Build
        shell: pwsh
        run: |
          if (Test-Path "dist/ImanAdmin.exe") {
            Write-Host "✅ EXE ساخته شد"
            Get-Item "dist/ImanAdmin.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE ساخته نشد!"
            exit 1
          }
      
      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: ImanAdmin-32bit
          path: dist/ImanAdmin.exe
          retention-days: 30
